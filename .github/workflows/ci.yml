name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: integration + security tests
        run: |
          python3 keygen.py server.key
          python3 keygen.py node1.key
          python3 make_test_targets.py --count 1000 \
            --plant abcdef0123456789abcdef0123456789abcdef0123456789000005:0x1234ABCD \
            > targets.txt
          python3 - <<'PY'
          import json
          from secp import compressed
          space="abcdef0123456789abcdef0123456789abcdef0123456789"
          priv=(int(space+"%06x"%5,16)<<40)+0x1234ABCD
          json.dump({"space_prefix":space,"targets_file":"targets.txt","lease_seconds":3600,"max_blocks":4096},open("coord.json","w"))
          json.dump({"priv":"%064x"%priv,"pub":compressed(priv),"block_idx":5},open("planted.json","w"))
          PY
          python3 test_e2e.py
